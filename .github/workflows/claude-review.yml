name: Claude Independent Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check API access before starting a paid review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_MODEL: claude-opus-5-5
        run: python3 scripts/claude_diagnostics.py preflight
      - name: Claude independent product review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}
            The pull request branch is checked out. After inspection, post your complete assessment as exactly one top-level PR comment with `gh pr comment`, beginning with `<!-- claude-product-review:${{ github.event.pull_request.head.sha }} -->`. Do not leave the answer solely in the action transcript. Post the comment before finishing. If you cannot inspect all images, clearly state the limitation and verdict BLOCK. The workflow verifies that the comment exists and fails otherwise.

            You are the independent adversarial product reviewer for a Japanese LINE sticker product. Do not praise the creator. Inspect every changed file, then read CLAUDE.md, AGENTS.md, rules/README.md, rules/00-principles.md, rules/10-product-quality.md, docs/product-spec.md, docs/sticker-manifest.csv, and both full-set previews under assets/preview/. Inspect all 24 PNGs plus main.png and tab.png; do not infer visual quality from filenames alone.

            Evaluate sales utility, instant smartphone readability, exact Japanese, expression/phrase contradiction, character consistency, originality, dark-background visibility, duplication, LINE safety, and series potential. Specifically compare 04/18, 05/23, and 09/23; verify 11 reads as support, 12 as direction confusion, 17 as praise, 18 as clearly clueless, and 19-24 as purchase-driving jokes.

            First mark each of the nine critical defects in rules/10-product-quality.md PASS or FAIL. Then score: first impression 20, daily utility 20, contradiction comedy 20, character consistency 15, readability 10, originality/series potential 10, technical safety 5. Review 01-24 in a table with KEEP/POLISH/REPLACE. Review main and tab separately. Limit proposed changes to the five highest-impact fixes and make every fix directly implementable: exact gaze, brows, mouth/tongue, pose, prop, composition and safe margin. Never request imitation of an existing character.

            Approve only when every critical check passes and total score is at least 88/100. End with exactly one verdict: APPROVE, REQUEST_CHANGES, or BLOCK. If not approved, state which exact acceptance condition failed. Do not modify repository files.
            
            Immediately before that final verdict line, include exactly one HTML comment with this form (plain JSON inside; no code fence):
            <!-- claude-review-gate
            {the JSON object described below}
            -->
            Required JSON keys only: head_sha (the HEAD SHA above), score (integer total), scores, critical_checks, inspected_assets, verdict.
            scores must contain exactly these integer categories and caps: first_impression (20), daily_utility (20), contradiction_comedy (20), character_consistency (15), readability (10), originality_series (10), technical_safety (5). Their sum must equal score.
            critical_checks must contain exactly keys "1" through "9", each with your actual "PASS" or "FAIL" finding.
            inspected_assets must list exactly "01" through "24", "main", "tab", "preview_light", and "preview_dark", only after inspecting all of them.
            verdict must equal the final verdict line. Do not change your findings to satisfy the parser: lower scores or a FAIL must remain REQUEST_CHANGES or BLOCK. Include this structured object both in the posted comment and in your final full assessment.
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Bash(gh pr comment:*),Bash(gh pr view:*),Bash(gh api:*)"
      - name: Record safe Claude execution diagnostic
        if: always()
        env:
          REVIEW_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: python3 scripts/claude_diagnostics.py execution
      - name: Publish and validate Claude review
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_FILE: ${{ steps.claude.outputs.execution_file }}
          REVIEW_REPO: ${{ github.repository }}
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/validate_claude_review.py
      - name: Preserve safe review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            claude-*-diagnostic.json
            claude-review-gate.json
          retention-days: 7
          if-no-files-found: ignore
