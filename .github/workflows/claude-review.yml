name: Claude Independent Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Claude independent product review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the independent adversarial product reviewer for a Japanese LINE sticker product. Do not praise the creator. Inspect every changed file, then read CLAUDE.md, AGENTS.md, rules/README.md, rules/00-principles.md, rules/10-product-quality.md, docs/product-spec.md, docs/sticker-manifest.csv, and both full-set previews under assets/preview/. Inspect all 24 PNGs plus main.png and tab.png; do not infer visual quality from filenames alone.

            Evaluate sales utility, instant smartphone readability, exact Japanese, expression/phrase contradiction, character consistency, originality, dark-background visibility, duplication, LINE safety, and series potential. Specifically compare 04/18, 05/23, and 09/23; verify 11 reads as support, 12 as direction confusion, 17 as praise, 18 as clearly clueless, and 19-24 as purchase-driving jokes.

            First mark each of the nine critical defects in rules/10-product-quality.md PASS or FAIL. Then score: first impression 20, daily utility 20, contradiction comedy 20, character consistency 15, readability 10, originality/series potential 10, technical safety 5. Review 01-24 in a table with KEEP/POLISH/REPLACE. Review main and tab separately. Limit proposed changes to the five highest-impact fixes and make every fix directly implementable: exact gaze, brows, mouth/tongue, pose, prop, composition and safe margin. Never request imitation of an existing character.

            Approve only when every critical check passes and total score is at least 88/100. End with exactly one verdict: APPROVE, REQUEST_CHANGES, or BLOCK. If not approved, state which exact acceptance condition failed. Do not modify repository files.
          claude_args: |
            --max-turns 40
